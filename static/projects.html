<!DOCTYPE html>
<html lang="en">

<head>
    <title>micetery_ projects page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/projects.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>

<body>
    <!-- navbar -->
    <header class="sticky-top">
        <nav>
            <ul class="navbar"></ul>
        </nav>
    </header>
    <div class="container">
        <div id="cover"></div>
        <div class="grid-container">
            <!-- Projects list -->
            <section class="projects card reveal" style="padding: 1.5rem; --reveal-order: 0;">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 1rem;">
                    <h3 style="margin: 0;">My Projects</h3>
                    <div id="view-toggle">
                        <button id="list-view-btn" class="view-btn active" title="List view">
                            <i class="fas fa-list"></i>
                        </button>
                        <button id="grid-view-btn" class="view-btn" title="Grid view">
                            <i class="fas fa-grip"></i>
                        </button>
                    </div>
                </div>
                <div id="projects" class="projects-list">
                    // display recent projects here
                </div>
            </section>
        </div>
        <!-- footer -->
        <section class="footer card2">
            <p style="margin-left:1rem;">micetery_ © <span id="year"></span> - Privacy Policy</p>
            <p style="margin-right:1rem;">Hong Kong</p>
        </section>
    </div>

    <script src="./js/loading.js"></script>
    <script src="./js/navbar.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/projects.js"></script>
    <script>
        window.onload = function () {
            display(false);
        };
    </script>
</body>

</html>
